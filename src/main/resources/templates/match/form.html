<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume-Job Matching - ApplicantAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .container {
            max-width: 1200px;
        }
        .form-container {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .text-area-container {
            height: 100%;
        }
        textarea {
            height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .result-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
            display: none;
        }
        .match-score {
            font-size: 48px;
            font-weight: bold;
        }
        .match-score-excellent {
            color: #28a745;
        }
        .match-score-good {
            color: #17a2b8;
        }
        .match-score-average {
            color: #ffc107;
        }
        .match-score-poor {
            color: #dc3545;
        }
        .skill-badge {
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .suggestion-item {
            padding: 10px;
            border-left: 4px solid #007bff;
            background-color: #f8f9fa;
            margin-bottom: 10px;
        }
        .suggestion-category {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #dee2e6;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .progress-circle {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }
        .progress-circle-bg {
            fill: none;
            stroke: #e9ecef;
            stroke-width: 10;
        }
        .progress-circle-value {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease-out;
        }
        .progress-circle-text {
            font-size: 2rem;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .score-label {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .score-details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .score-detail {
            text-align: center;
            width: 30%;
        }
        .score-detail-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .score-detail-label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .suggestion-icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        .tab-content {
            padding: 20px;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>ApplicantAI Resume Optimizer</h1>
            <p class="lead">Match your resume with a job description to get optimization suggestions</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="form-container">
            <h2 class="mb-4">Resume-Job Matching</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group text-area-container mb-3">
                        <label for="resumeContent"><strong>Resume Content</strong></label>
                        <textarea id="resumeContent" class="form-control" placeholder="Paste your resume content here..."></textarea>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group text-area-container mb-3">
                        <label for="jobDescription"><strong>Job Description</strong></label>
                        <textarea id="jobDescription" class="form-control" placeholder="Paste the job description here..."></textarea>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <button id="matchButton" class="btn btn-primary btn-lg">Match Resume with Job</button>
            </div>
        </div>

        <div id="resultContainer" class="result-container">
            <h2 class="mb-4">Match Results</h2>
            
            <!-- Overall Match Score -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="progress-circle">
                        <svg viewBox="0 0 100 100">
                            <circle class="progress-circle-bg" cx="50" cy="50" r="40"></circle>
                            <circle id="scoreCircle" class="progress-circle-value" cx="50" cy="50" r="40" stroke="#28a745"></circle>
                            <text id="scoreText" class="progress-circle-text" x="50" y="50">0%</text>
                        </svg>
                    </div>
                    <div class="score-label">Overall Match Score</div>
                </div>
                <div class="col-md-8">
                    <div class="score-details">
                        <div class="score-detail">
                            <div id="skillScore" class="score-detail-value">0%</div>
                            <div class="score-detail-label">Skills</div>
                        </div>
                        <div class="score-detail">
                            <div id="experienceScore" class="score-detail-value">0%</div>
                            <div class="score-detail-label">Experience</div>
                        </div>
                        <div class="score-detail">
                            <div id="educationScore" class="score-detail-value">0%</div>
                            <div class="score-detail-label">Education</div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <p id="matchSummary" class="lead"></p>
                    </div>
                </div>
            </div>
            
            <!-- Skills Tabs -->
            <ul class="nav nav-tabs" id="skillsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="matching-tab" data-bs-toggle="tab" data-bs-target="#matching" type="button" role="tab" aria-controls="matching" aria-selected="true">Matching Skills</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="missing-tab" data-bs-toggle="tab" data-bs-target="#missing" type="button" role="tab" aria-controls="missing" aria-selected="false">Missing Skills</button>
                </li>
            </ul>
            <div class="tab-content" id="skillsTabsContent">
                <div class="tab-pane fade show active" id="matching" role="tabpanel" aria-labelledby="matching-tab">
                    <div id="matchingSkills"></div>
                </div>
                <div class="tab-pane fade" id="missing" role="tabpanel" aria-labelledby="missing-tab">
                    <div id="missingSkills"></div>
                </div>
            </div>
            
            <!-- Optimization Suggestions -->
            <div class="row mt-4">
                <div class="col-12">
                    <h3>Optimization Suggestions</h3>
                    
                    <div class="accordion" id="suggestionsAccordion">
                        <!-- Skills Suggestions -->
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="skillsHeading">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#skillsCollapse" aria-expanded="true" aria-controls="skillsCollapse">
                                    <i class="bi bi-gear-fill suggestion-icon"></i> Skills Optimization
                                </button>
                            </h2>
                            <div id="skillsCollapse" class="accordion-collapse collapse show" aria-labelledby="skillsHeading" data-bs-parent="#suggestionsAccordion">
                                <div class="accordion-body">
                                    <div id="skillSuggestions"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Content Suggestions -->
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="contentHeading">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#contentCollapse" aria-expanded="false" aria-controls="contentCollapse">
                                    <i class="bi bi-file-text-fill suggestion-icon"></i> Content Optimization
                                </button>
                            </h2>
                            <div id="contentCollapse" class="accordion-collapse collapse" aria-labelledby="contentHeading" data-bs-parent="#suggestionsAccordion">
                                <div class="accordion-body">
                                    <div id="contentSuggestions"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Format Suggestions -->
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="formatHeading">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#formatCollapse" aria-expanded="false" aria-controls="formatCollapse">
                                    <i class="bi bi-layout-text-window suggestion-icon"></i> Format Optimization
                                </button>
                            </h2>
                            <div id="formatCollapse" class="accordion-collapse collapse" aria-labelledby="formatHeading" data-bs-parent="#suggestionsAccordion">
                                <div class="accordion-body">
                                    <div id="formatSuggestions"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const matchButton = document.getElementById('matchButton');
            const resultContainer = document.getElementById('resultContainer');
            const scoreText = document.getElementById('scoreText');
            const scoreCircle = document.getElementById('scoreCircle');
            const skillScore = document.getElementById('skillScore');
            const experienceScore = document.getElementById('experienceScore');
            const educationScore = document.getElementById('educationScore');
            const matchSummary = document.getElementById('matchSummary');
            const matchingSkills = document.getElementById('matchingSkills');
            const missingSkills = document.getElementById('missingSkills');
            const skillSuggestions = document.getElementById('skillSuggestions');
            const contentSuggestions = document.getElementById('contentSuggestions');
            const formatSuggestions = document.getElementById('formatSuggestions');

            matchButton.addEventListener('click', function() {
                const resumeContent = document.getElementById('resumeContent').value;
                const jobDescription = document.getElementById('jobDescription').value;

                if (!resumeContent || !jobDescription) {
                    alert('Please enter both resume content and job description.');
                    return;
                }

                // Show loading state
                matchButton.disabled = true;
                matchButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Matching...';

                // Call the API
                fetch('/api/v1/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resumeContent: resumeContent,
                        jobDescription: jobDescription
                    })
                })
                .then(response => response.json())
                .then(data => {
                    // Reset button
                    matchButton.disabled = false;
                    matchButton.innerHTML = 'Match Resume with Job';

                    if (data.success) {
                        // Show results
                        resultContainer.style.display = 'block';
                        
                        // Update match score visualization
                        updateScoreVisualization(data.matchScore);
                        
                        // Update detailed scores
                        skillScore.textContent = data.skillMatchScore + '%';
                        experienceScore.textContent = data.experienceMatchScore + '%';
                        educationScore.textContent = data.educationMatchScore + '%';
                        
                        // Update match summary
                        updateMatchSummary(data.matchScore);
                        
                        // Update matching skills
                        matchingSkills.innerHTML = '';
                        Object.entries(data.matchingSkills).forEach(([skill, score]) => {
                            const badge = document.createElement('span');
                            badge.className = 'badge skill-badge ' + getScoreClass(score);
                            badge.textContent = `${skill} (${score}%)`;
                            matchingSkills.appendChild(badge);
                        });
                        
                        // Update missing skills
                        missingSkills.innerHTML = '';
                        Object.entries(data.missingSkills).forEach(([skill, score]) => {
                            const badge = document.createElement('span');
                            badge.className = 'badge bg-danger skill-badge';
                            badge.textContent = `${skill} (${score}%)`;
                            missingSkills.appendChild(badge);
                        });
                        
                        // Categorize and update suggestions
                        categorizeAndDisplaySuggestions(data.suggestions);
                        
                        // Scroll to results
                        resultContainer.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    matchButton.disabled = false;
                    matchButton.innerHTML = 'Match Resume with Job';
                    alert('An error occurred. Please try again.');
                });
            });
            
            function updateScoreVisualization(score) {
                // Update text
                scoreText.textContent = score + '%';
                
                // Update circle
                const radius = 40;
                const circumference = 2 * Math.PI * radius;
                const dashOffset = circumference * (1 - score / 100);
                
                scoreCircle.style.strokeDasharray = circumference;
                scoreCircle.style.strokeDashoffset = dashOffset;
                
                // Update color based on score
                if (score >= 90) {
                    scoreCircle.style.stroke = '#28a745'; // Excellent - Green
                } else if (score >= 70) {
                    scoreCircle.style.stroke = '#17a2b8'; // Good - Blue
                } else if (score >= 50) {
                    scoreCircle.style.stroke = '#ffc107'; // Average - Yellow
                } else {
                    scoreCircle.style.stroke = '#dc3545'; // Poor - Red
                }
            }
            
            function updateMatchSummary(score) {
                let message = '';
                if (score >= 90) {
                    message = 'Excellent match! Your resume is well-aligned with this job description.';
                } else if (score >= 70) {
                    message = 'Good match! With a few optimizations, your resume could be an excellent fit.';
                } else if (score >= 50) {
                    message = 'Average match. Consider implementing the suggestions to improve your chances.';
                } else {
                    message = 'This position may not be the best fit for your current resume. Consider significant revisions.';
                }
                matchSummary.textContent = message;
            }
            
            function getScoreClass(score) {
                if (score >= 90) {
                    return 'bg-success'; // Excellent - Green
                } else if (score >= 70) {
                    return 'bg-info'; // Good - Blue
                } else if (score >= 50) {
                    return 'bg-warning'; // Average - Yellow
                } else {
                    return 'bg-danger'; // Poor - Red
                }
            }
            
            function categorizeAndDisplaySuggestions(suggestions) {
                // Clear previous suggestions
                skillSuggestions.innerHTML = '';
                contentSuggestions.innerHTML = '';
                formatSuggestions.innerHTML = '';
                
                // Categorize suggestions
                suggestions.forEach(suggestion => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = suggestion;
                    
                    // Simple categorization based on keywords
                    if (suggestion.toLowerCase().includes('skill') || 
                        suggestion.toLowerCase().includes('add') || 
                        suggestion.toLowerCase().includes('missing')) {
                        skillSuggestions.appendChild(div);
                    } else if (suggestion.toLowerCase().includes('format') || 
                               suggestion.toLowerCase().includes('ats') || 
                               suggestion.toLowerCase().includes('bullet') ||
                               suggestion.toLowerCase().includes('page')) {
                        formatSuggestions.appendChild(div);
                    } else {
                        contentSuggestions.appendChild(div);
                    }
                });
                
                // Add default message if no suggestions in a category
                if (skillSuggestions.children.length === 0) {
                    skillSuggestions.innerHTML = '<div class="suggestion-item">No skill-specific suggestions.</div>';
                }
                if (contentSuggestions.children.length === 0) {
                    contentSuggestions.innerHTML = '<div class="suggestion-item">No content-specific suggestions.</div>';
                }
                if (formatSuggestions.children.length === 0) {
                    formatSuggestions.innerHTML = '<div class="suggestion-item">No format-specific suggestions.</div>';
                }
            }
        });
    </script>
</body>
</html>
